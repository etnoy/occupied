# Regression fixture: disjoint boundary ranges can still sample a too-short window.
schema_version: 1
name: Resilient random samples
steps:
  always:
    timing:
      absolute_time:
        start: '01:00'
    action: script.turn_on
    entities: [script.clock]
random:
  evening:
    start:
      absolute_time:
        start: '18:00'
        end: '19:30'
    end:
      absolute_time:
        start: '19:30'
        end: '20:00'
    min_duration: 30m
    max_duration: 45m
    count: 1
    'on':
      action: turn_on
      entities: [light.clock]
    'off':
      action: turn_off
      entities: [light.clock]
