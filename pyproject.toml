[project]
name = "occupied"
version = "0.1.1"
description = "Occupancy simulator for Home Assistant"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13.2"
dependencies = ["pydantic>=2.11.3,<3", "PyYAML>=6.0.2,<7", "astral>=2.2,<3"]

[project.scripts]
occupied = "custom_components.occupied.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["custom_components", "custom_components.occupied*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.occupied" = [
  "manifest.json", "services.yaml", "strings.json", "translations/*.json", "frontend/dist/*.js", "frontend/dist/**/*.js", "brand/*.png",
]

[dependency-groups]
test-core = [
  "pytest>=8.3.5,<10",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=6,<8",
  "freezegun>=1.5,<2",
  "pytest-socket>=0.7,<1",
]
dev = [
  {include-group = "test-core"},
  "homeassistant==2026.10.2",
  "ruff>=0.14,<1",
  "pytest-homeassistant-custom-component==0.13.373",
  "home-assistant-frontend==20260930.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib --disable-socket --allow-unix-socket"
filterwarnings = ["error::DeprecationWarning:custom_components[.]occupied"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.14.2"}
