[project]
name = "occupied"
version = "0.1.0"
description = "A native Home Assistant occupancy simulator (milestone 1)"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "homeassistant==2026.9.4",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "freezegun>=1.5,<2",
  "pytest-socket>=0.7,<1",
  "pytest-homeassistant-custom-component>=0.13",
  "home-assistant-frontend==20260826.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
