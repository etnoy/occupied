version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: chore
      include: scope
    exclude-paths: ["scripts/requirements/**"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # ha_matrix.py roll moves HA, its fixture and their constrained dependencies together.
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: home-assistant-frontend
      - dependency-name: astral
      - dependency-name: pyyaml
      - dependency-name: pydantic
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-cov
      - dependency-name: pytest-socket
      - dependency-name: freezegun
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
