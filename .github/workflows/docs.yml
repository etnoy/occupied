name: Documentation links

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline --include-fragments
            README.md 'docs/**/*.md'
            custom_components/occupied/frontend/README.md
            tests/fixtures/programs/README.md
      - name: Check external documentation links on manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --include-fragments --max-retries 3 --timeout 20
            README.md 'docs/**/*.md'
            custom_components/occupied/frontend/README.md
            tests/fixtures/programs/README.md
      - name: Upload link-check report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-links
          path: lychee/out.md
          if-no-files-found: ignore
          retention-days: 7
