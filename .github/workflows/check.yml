name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    strategy:
      matrix:
        # ha-matrix:start
        include:
          - format: 1
            policy:
              window: 18
              python_floor: 3.13.2
              python_latest: 3.14.8
              python_next: "3.15"
              uv: 0.13.4
              security_overrides:
                anyio: 4.14.2
                yarl: 1.25.1
                pillow: 13.0.0
                pyjwt: 2.14.0
                uv: 0.13.4
            lanes:
              - id: ha-2025.5.0
                role: floor
                homeassistant: 2025.5.0
                phcc: 0.13.243
                frontend: "20250507.0"
                python: 3.13.12
