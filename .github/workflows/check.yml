                image: ghcr.io/home-assistant/home-assistant:2026.2.3@sha256:96fa92d83fa8dae987fbbbcf58b1fea1140985ff6a8517b37f7b65c76ef20133
                constraints_sha256: 31564297db12c62b93acc02e0522d51e98024b4f76ed83dd84dd19442f8a60ae
                python_min: 3.13.2
              - id: ha-2026.3.4
                role: window
                homeassistant: 2026.3.4
                phcc: 0.13.320
                frontend: "20260312.1"
                python: 3.14.8
                image: ghcr.io/home-assistant/home-assistant:2026.3.4@sha256:916682086154a7390114a9788782b8efb199852d4f7d47066722c2bc5d1829e6
                constraints_sha256: 0969691525fa33e509962d7ffc57cfee9c425a47b9d71f5e4be54bd336ef4eb3
