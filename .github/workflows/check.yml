name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.9.3", "2026.9.4"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install locked baseline
        if: matrix.homeassistant == '2026.9.4'
        run: uv sync --locked
      - name: Install locked minimum HA
        if: matrix.homeassistant == '2026.9.3'
        run: |
          uv venv --python 3.14.8
          uv pip sync --require-hashes scripts/requirements-ha-2026.9.3.txt
          uv pip install --no-deps -e .
      - run: .venv/bin/ruff check custom_components tests scripts
      - run: .venv/bin/ruff format --check custom_components tests scripts
      - run: .venv/bin/pytest --cov=custom_components.occupied --cov-fail-under=88
      - run: .venv/bin/python scripts/check_release.py
      - run: .venv/bin/occupied-config validate examples/house.yaml --date 2026-10-06 --days 7 --seed release --timezone Europe/Stockholm
      - run: .venv/bin/occupied-config validate examples/gui-house.yaml --date 2026-10-06 --days 7 --seed release --timezone Europe/Stockholm

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.23"
          python-version: "3.14.8"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --no-dev --locked
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:check
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"

  package:
    needs: [python, frontend, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.23"
          python-version: "3.14.8"
      - run: uv sync --no-dev --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: uv build --out-dir dist
      - run: .venv/bin/python scripts/build_release.py
      - run: .venv/bin/python scripts/check_artifacts.py dist
      - name: Verify standalone CLI wheel outside the checkout
        run: |
          uv venv /tmp/occupied-cli --python 3.14.8
          uv pip install --python /tmp/occupied-cli/bin/python dist/occupied-*-py3-none-any.whl
          cd /tmp
          /tmp/occupied-cli/bin/python -c 'import sys; from custom_components.occupied.cli import main; assert "homeassistant" not in sys.modules'
          /tmp/occupied-cli/bin/occupied-config validate "$GITHUB_WORKSPACE/examples/house.yaml" --date 2026-10-06 --days 7 --timezone Europe/Stockholm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: occupied-release
          path: dist/*
          retention-days: 7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: occupied-release
          path: /tmp/occupied-artifact
      - name: Verify the uploaded artifact can be downloaded intact
        run: .venv/bin/python scripts/check_artifacts.py /tmp/occupied-artifact
