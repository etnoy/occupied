                constraints_sha256: fbd4fb4bbbb564889a67455dcefa1977e876f2c64150974d64a3f20baeb05f51
                python_min: 3.14.2
              - id: ha-2026.7.4
                role: window
                homeassistant: 2026.7.4
                phcc: 0.13.348
                frontend: "20260624.6"
                python: 3.14.8
                image: ghcr.io/home-assistant/home-assistant:2026.7.4@sha256:5a531753cea96444200158fc2b0ac7ccd739291ec50414877b396de6e0bb29b3
                constraints_sha256: 3ec2148f62c7d953407b593b2d6448c89f34eac2be468b97987caf55561983c1
                python_min: 3.14.2
              - id: ha-2026.8.3
                role: window
                homeassistant: 2026.8.3
                phcc: 0.13.357
                frontend: "20260729.7"
                python: 3.14.8
                image: ghcr.io/home-assistant/home-assistant:2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
                constraints_sha256: 94db4ee9d7731452e9479e96e72777454ccf69c0ec6a5a0742da330eaa7b7a42
                python_min: 3.14.2
              - id: ha-2026.9.4
                role: window
                homeassistant: 2026.9.4
                phcc: 0.13.367
                frontend: "20260826.7"
                python: 3.14.8
                image: ghcr.io/home-assistant/home-assistant:2026.9.4@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76
                constraints_sha256: 962c9ccaf398e0b92b10ac9f765ac0f17e22238adc4e768deebc051ee8b60651
                python_min: 3.14.2
              - id: ha-2026.10.2
                role: newest
                homeassistant: 2026.10.2
                phcc: 0.13.373
                frontend: "20260930.4"
                python: 3.14.8
                image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
                constraints_sha256: 7baa9a8f39ddeb9c5bb60a1036f6d5e33f4b84267f151f53cc2b95ef031a21b5
                python_min: 3.14.2
              - id: python-floor
                role: python-floor
                homeassistant: 2026.10.2
                phcc: 0.13.373
                frontend: "20260930.4"
                python: 3.14.2
                image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
                constraints_sha256: 7baa9a8f39ddeb9c5bb60a1036f6d5e33f4b84267f151f53cc2b95ef031a21b5
                python_min: 3.14.2
        # ha-matrix:end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ha: ${{ steps.matrix.outputs.ha }}
      python-floor: ${{ steps.matrix.outputs.python-floor }}
      core: ${{ steps.matrix.outputs.core }}
      core-next: ${{ steps.matrix.outputs.core-next }}
      browser: ${{ steps.matrix.outputs.browser }}
      uv: ${{ matrix.policy.uv }}
      python: ${{ matrix.policy.python_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ matrix.policy.uv }}
          python-version: ${{ matrix.policy.python_latest }}
      - run: uv sync --locked --no-dev --group test-core
      - id: matrix
        run: |
          uv run --no-dev --group test-core python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from scripts.ha_matrix import github_matrix
          for kind in ("ha", "python-floor", "browser"):
              print(kind + "=" + json.dumps(github_matrix(kind)))
          core = github_matrix("core")["include"]
          print("core=" + json.dumps({"include": [row for row in core if not row["experimental"]]}))
          print("core-next=" + json.dumps({"include": [row for row in core if row["experimental"]]}))
          PY

  python:
    name: Python (HA ${{ matrix.homeassistant }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.ha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ matrix.uv }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked newest HA
        if: matrix.role == 'newest'
        run: uv sync --locked
      - name: Install hashed HA lane
        if: matrix.role != 'newest'
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          uv venv
          uv pip sync --require-hashes "$REQUIREMENTS"
          uv pip install --no-deps -e .
      - name: Verify installed dependency constraints
        env:
          LANE_ID: ${{ matrix.id }}
        run: .venv/bin/python scripts/ha_matrix.py check-installed --lane "$LANE_ID"
      - if: matrix.role == 'newest'
        run: .venv/bin/ruff check custom_components tests scripts
      - if: matrix.role == 'newest'
        run: .venv/bin/ruff format --check custom_components tests scripts
      - name: Test newest HA with coverage
        if: matrix.role == 'newest'
        run: .venv/bin/pytest --cov=custom_components.occupied --cov-fail-under=88 --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=test-results/python.xml
      - name: Test supported HA lane
        if: matrix.role != 'newest'
        run: .venv/bin/pytest --junitxml=test-results/python.xml
      - name: Upload Python coverage and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-results-${{ matrix.id }}
          path: |
            coverage.xml
            htmlcov/
            test-results/python.xml
          if-no-files-found: ignore
          retention-days: 7
      - if: matrix.role == 'newest'
        run: .venv/bin/python scripts/check_release.py
      - if: matrix.role == 'newest'
        run: .venv/bin/python scripts/ha_matrix.py check

  python-floor:
    name: Python floor (${{ matrix.python }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix: ${{ fromJSON(needs.matrix.outputs.python-floor) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ matrix.uv }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv pip check
      - run: .venv/bin/pytest --junitxml=test-results/python-floor.xml
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-results-floor
          path: test-results/python-floor.xml
          if-no-files-found: ignore
          retention-days: 7

  core:
    name: Standalone core (Python ${{ matrix.python }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.core) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ needs.matrix.outputs.uv }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Resolve standalone ranges without Home Assistant
        run: |
          uv venv
          uv pip install -e . --group test-core
          uv pip check
          .venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("homeassistant") is None'
      - run: .venv/bin/pytest tests/core --junitxml=test-results/core.xml
      - name: Validate all example programs through the standalone CLI
        run: |
          for program in examples/*.yaml; do
            .venv/bin/occupied validate "$program" --date 2026-10-13 --days 7 --timezone Europe/Stockholm --latitude 59.3 --longitude 18.1
          done
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-results-${{ matrix.python }}
          path: test-results/core.xml
          if-no-files-found: ignore
          retention-days: 7

  core-next:
    name: Standalone core (Python ${{ matrix.python }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.core-next) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ needs.matrix.outputs.uv }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Resolve standalone ranges without Home Assistant
        run: |
          uv venv
          uv pip install -e . --group test-core
          uv pip check
          .venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("homeassistant") is None'
      - run: .venv/bin/pytest tests/core --junitxml=test-results/core.xml
      - name: Validate all example programs through the standalone CLI
        run: |
          for program in examples/*.yaml; do
            .venv/bin/occupied validate "$program" --date 2026-10-13 --days 7 --timezone Europe/Stockholm --latitude 59.3 --longitude 18.1
          done
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-results-${{ matrix.python }}
          path: test-results/core.xml
          if-no-files-found: ignore
          retention-days: 7
      # Functional tests are required; missing wheels do not block source installs.
      - name: Report next-Python wheel readiness
        id: wheels
        continue-on-error: true
        run: .venv/bin/python scripts/check_core_wheels.py "${{ matrix.python }}"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.25.0"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify committed frontend assets before running tests
        run: pnpm run build:check
      - name: Lint TypeScript and Svelte scripts and templates
        run: pnpm run lint
      - name: Check TypeScript and Svelte types
        run: pnpm run typecheck
      - name: Check formatting including Svelte and CSS
        run: pnpm run format:check
      - run: pnpm test

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # main (2026-09-27)

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: "false"

  package:
    needs: [matrix, python, frontend, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ needs.matrix.outputs.uv }}
          python-version: ${{ needs.matrix.outputs.python }}
      - run: uv sync --no-dev --locked
      - run: uv build --out-dir dist
      - run: .venv/bin/python scripts/build_release.py
      - run: .venv/bin/python scripts/check_artifacts.py dist
      - name: Verify standalone CLI wheel outside the checkout
        run: |
          uv venv /tmp/occupied-cli --python "${{ needs.matrix.outputs.python }}"
          uv pip install --python /tmp/occupied-cli/bin/python dist/occupied-*-py3-none-any.whl
          cd /tmp
          /tmp/occupied-cli/bin/python -c 'import sys; from custom_components.occupied.cli import main; assert "homeassistant" not in sys.modules'
          /tmp/occupied-cli/bin/occupied validate "$GITHUB_WORKSPACE/examples/house.yaml" --date 2026-10-06 --days 7 --timezone Europe/Stockholm --latitude 59.3 --longitude 18.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: occupied-release
          path: dist/*
          retention-days: 7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: occupied-release
          path: /tmp/occupied-artifact
      - name: Verify the uploaded artifact can be downloaded intact
        run: .venv/bin/python scripts/check_artifacts.py /tmp/occupied-artifact

  docs:
    uses: ./.github/workflows/docs.yml

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and run actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -color

  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  browser:
    name: Browser (HA ${{ matrix.homeassistant }})
    needs: [matrix, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.browser) }}
    env:
      HA_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: occupied-release
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.25.0"
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - name: Upload browser report, traces, screenshots, and HA logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.id }}
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/browser/
            .browser-artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      [
        matrix,
        python,
        python-floor,
        core,
        core-next,
        frontend,
        hassfest,
        hacs,
        package,
        docs,
        workflows,
        security,
        browser,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
