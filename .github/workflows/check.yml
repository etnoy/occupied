name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.10.0", "2026.10.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
      - name: Install locked baseline
        if: matrix.homeassistant == '2026.10.1'
        run: uv sync --locked
      - name: Install locked minimum HA
        if: matrix.homeassistant == '2026.10.0'
        run: |
          uv venv --python 3.14.8
          uv pip sync --require-hashes scripts/requirements-ha-2026.10.0.txt
          uv pip install --no-deps -e .
      - name: Verify installed dependency constraints
        run: uv pip check
      - run: .venv/bin/ruff check custom_components tests scripts
      - run: .venv/bin/ruff format --check custom_components tests scripts
      - run: .venv/bin/pytest --cov=custom_components.occupied --cov-fail-under=88 --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=test-results/python.xml
      - name: Upload Python coverage and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-results-${{ matrix.homeassistant }}
          path: |
            coverage.xml
            htmlcov/
            test-results/python.xml
          if-no-files-found: ignore
          retention-days: 7
      - run: .venv/bin/python scripts/check_release.py
      - run: .venv/bin/occupied validate examples/house.yaml --date 2026-10-06 --days 7 --seed release --timezone Europe/Stockholm --latitude 59.3 --longitude 18.1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.25.0"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify committed frontend assets before running tests
        run: pnpm run build:check
      - name: Lint TypeScript and Svelte scripts and templates
        run: pnpm run lint
      - name: Check TypeScript and Svelte types
        run: pnpm run typecheck
      - name: Check formatting including Svelte and CSS
        run: pnpm run format:check
      - run: pnpm test

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # main (2026-09-27)

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: "false"

  package:
    needs: [python, frontend, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"
      - run: uv sync --no-dev --locked
      - run: uv build --out-dir dist
      - run: .venv/bin/python scripts/build_release.py
      - run: .venv/bin/python scripts/check_artifacts.py dist
      - name: Verify standalone CLI wheel outside the checkout
        run: |
          uv venv /tmp/occupied-cli --python 3.14.8
          uv pip install --python /tmp/occupied-cli/bin/python dist/occupied-*-py3-none-any.whl
          cd /tmp
          /tmp/occupied-cli/bin/python -c 'import sys; from custom_components.occupied.cli import main; assert "homeassistant" not in sys.modules'
          /tmp/occupied-cli/bin/occupied validate "$GITHUB_WORKSPACE/examples/house.yaml" --date 2026-10-06 --days 7 --timezone Europe/Stockholm --latitude 59.3 --longitude 18.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: occupied-release
          path: dist/*
          retention-days: 7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: occupied-release
          path: /tmp/occupied-artifact
      - name: Verify the uploaded artifact can be downloaded intact
        run: .venv/bin/python scripts/check_artifacts.py /tmp/occupied-artifact

  docs:
    uses: ./.github/workflows/docs.yml

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and run actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -color

  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  browser:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: occupied-release
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.25.0"
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - name: Upload browser report, traces, screenshots, and HA logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/browser/
            .browser-artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      [
        python,
        frontend,
        hassfest,
        hacs,
        package,
        docs,
        workflows,
        security,
        browser,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
