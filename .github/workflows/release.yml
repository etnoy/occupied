name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install packaging==26.3
      - name: Verify tag and release metadata
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_preflight.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: preflight
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/check.yml

  publish:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: occupied-release
          path: dist
      - name: Verify tag and asset checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('dist/occupied.zip') as archive:
              version = json.loads(archive.read('manifest.json'))['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
          cd dist
          sha256sum --check SHA256SUMS
      - run: python -m pip install PyYAML==6.0.3
      - name: Generate compatibility release notes
        id: compatibility
        run: echo "notes=$(python scripts/release_notes.py)" >> "$GITHUB_OUTPUT"
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMPATIBILITY_NOTES: ${{ steps.compatibility.outputs.notes }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "Occupied $RELEASE_TAG" --notes "$COMPATIBILITY_NOTES" --generate-notes
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Occupied $RELEASE_TAG" --notes "$COMPATIBILITY_NOTES" --generate-notes
          fi
