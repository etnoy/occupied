name: Dev release

# Publish every verified push to main as a HACS-installable prerelease, so
# development installs get the compiled frontend without committing it.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      KEEP: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: occupied-release
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify asset checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish dev prerelease
        run: |
          short="${HEAD_SHA::7}"
          tag="dev-${RUN_NUMBER}-${short}"
          gh release create "$tag" dist/* \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "Occupied dev build ${short}" \
            --notes "Automated development build of ${HEAD_SHA}. Not a supported release."
      - name: Prune old dev prereleases
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("dev-")))] | sort_by(.createdAt) | reverse | .[env.KEEP | tonumber:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
