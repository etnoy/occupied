start:
  name: Enable
  description: Enable permission and reevaluate activation conditions without bypassing them.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: occupied
stop:
  name: Disable
  description: Disable permission, cancel lighting convergence, and apply configured owned activity cleanup.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: occupied
pause:
  name: Pause
  description: Pause dispatch while retaining enabled permission.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: occupied
resume:
  name: Resume
  description: Resume by reevaluating permission and activation conditions.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: occupied
set_dry_run:
  name: Set dry run
  description: Select simulated execution for a daily program. Changing mode stops the previous session using its configured cleanup.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: occupied
    dry_run:
      required: true
      selector:
        boolean:
