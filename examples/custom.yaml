schema_version: 1
name: Custom YAML house
steps:
  sunset_lights:
    name: Sunset lights
    timing:
      relative_to:
        sun: sunset
    actions:
      - action: set_state
        entities:
          switch.porch_light:
            state: "on"
          light.living_room:
            state: "on"
            brightness: 255
          light.bedroom_window:
            state: "on"
            brightness: 20
          light.basement_window:
            state: "on"
            brightness: 24
          cover.living_room:
            position: 40
      - action: scene.turn_on
        entities:
          - scene.evening
  bedtime:
    timing:
      absolute_time:
        start: '23:00'
    action: turn_off
    entities:
      - switch.porch_light
      - light.living_room
      - light.bedroom_window
      - light.basement_window
