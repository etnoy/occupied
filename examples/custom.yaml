schema_version: 1
name: Custom YAML house
steps:
  sunset_lights:
    name: Sunset lights
    timing:
      relative_to: {sun: sunset}
    actions:
      - action: set_state
        entities:
          switch.elflugan:
            state: "on"
          light.fonsterspottar_vardagsrum:
            state: "on"
            brightness: 255
          light.fonsterspottar_sovrum:
            state: "on"
            brightness: 20
          light.fonsterspottar_williams_rum:
            state: "on"
            brightness: 100
          light.fonsterspottar_agnes_rum:
            state: "on"
            brightness: 24
          cover.living_room:
            position: 40
      - action: scene.turn_on
        entities: [scene.evening]
  bedtime:
    timing:
      absolute_time: {start: '23:00'}
    action: turn_off
    entities:
      - switch.elflugan
      - light.fonsterspottar_vardagsrum
      - light.fonsterspottar_sovrum
      - light.fonsterspottar_williams_rum
      - light.fonsterspottar_agnes_rum
